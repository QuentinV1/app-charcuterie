<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dégradé Fond Lie-de-vin Impérial Sombre -->
    <radialGradient id="bgGradP2" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2D0B12" />
      <stop offset="60%" stop-color="#1A050A" />
      <stop offset="100%" stop-color="#0F0205" />
    </radialGradient>

    <!-- Dégradé Or Cuivré Brossé -->
    <linearGradient id="goldCopperGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="30%" stop-color="#E2B76D" />
      <stop offset="60%" stop-color="#C79243" />
      <stop offset="100%" stop-color="#8F5D20" />
    </linearGradient>

    <!-- Dégradé Cœur Salaison Rubis -->
    <linearGradient id="meatRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1822" />
      <stop offset="100%" stop-color="#3D080E" />
    </linearGradient>

    <filter id="softGlowP2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="40" fill="url(#bgGradP2)" />

  <g transform="translate(400, 320)" filter="url(#softGlowP2)">
    <!-- 1. Arche de Cave Voûtée en Plein Cintre (Ligne Claire d'Exception) -->
    <!-- Arche extérieure en filet fin -->
    <path d="M-150,150 L-150,-40 C-150,-122 -82,-190 0,-190 C82,-190 150,-122 150,-40 L150,150" 
          fill="none" stroke="url(#goldCopperGrad)" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Arche intérieure principale -->
    <path d="M-135,150 L-135,-38 C-135,-112 -75,-172 0,-172 C75,-172 135,-112 135,-38 L135,150" 
          fill="none" stroke="url(#goldCopperGrad)" stroke-width="3.5" stroke-linecap="square" />

    <!-- Clé de voûte géométrique au sommet -->
    <polygon points="0,-182 12,-164 -12,-164" fill="url(#goldCopperGrad)" />

    <!-- Socles d'imposte de l'arche -->
    <line x1="-146" y1="150" x2="-124" y2="150" stroke="url(#goldCopperGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="124" y1="150" x2="146" y2="150" stroke="url(#goldCopperGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- 2. Suspension de Haute Précision -->
    <!-- Anneau de laiton au zénith intérieur -->
    <circle cx="0" cy="-125" r="7" fill="none" stroke="url(#goldCopperGrad)" stroke-width="2.5" />
    <!-- Tige d'acier laitonné tendue -->
    <line x1="0" y1="-118" x2="0" y2="-55" stroke="url(#goldCopperGrad)" stroke-width="2.5" />

    <!-- 3. Pièce d'Affinage Épure Sculpturelle (Forme Goutte Royale) -->
    <!-- Silhouette extérieure de salaison noble -->
    <path d="M0,-55 
             C-24,-40 -64,10 -64,65 
             C-64,115 -35,142 0,142 
             C35,142 64,115 64,65 
             C64,10 24,-40 0,-55 Z" 
          fill="#1E070B" stroke="url(#goldCopperGrad)" stroke-width="2.5" />

    <!-- Cœur rubis intérieur biseauté (évocation du séchage à cœur au sel sec) -->
    <path d="M0,-25 
             C-15,-10 -42,28 -42,65 
             C-42,100 -22,120 0,120 
             C22,120 42,100 42,65 
             C42,28 15,-10 0,-25 Z" 
          fill="url(#meatRubyGrad)" stroke="url(#goldCopperGrad)" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.8" />

    <!-- Fente centrale d'aération & goutte d'arôme dorée -->
    <line x1="0" y1="-10" x2="0" y2="70" stroke="url(#goldCopperGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="85" r="4" fill="url(#goldCopperGrad)" />

    <!-- Anneau d'ancrage basal discret -->
    <circle cx="0" cy="142" r="2.5" fill="url(#goldCopperGrad)" />
  </g>

  <!-- 4. Logotype Typographique -->
  <text x="400" y="585" 
        text-anchor="middle" 
        fill="url(#goldCopperGrad)" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="14">L’AFFINOIR</text>

  <!-- Ligne séparatrice avec losange épuré -->
  <g transform="translate(400, 622)">
    <line x1="-160" y1="0" x2="-20" y2="0" stroke="url(#goldCopperGrad)" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="3" fill="url(#goldCopperGrad)" />
    <line x1="20" y1="0" x2="160" y2="0" stroke="url(#goldCopperGrad)" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Sous-titre Signature -->
  <text x="400" y="658" 
        text-anchor="middle" 
        fill="#DFBA6E" 
        font-family="'Montserrat', 'Cinzel', sans-serif" 
        font-size="13" 
        font-weight="400" 
        letter-spacing="10" 
        fill-opacity="0.9">ATELIER DU TEMPS &amp; DU SEL</text>

  <!-- Mention terroir -->
  <text x="400" y="688" 
        text-anchor="middle" 
        fill="#9A6B3D" 
        font-family="'Playfair Display', 'Cormorant Garamond', serif" 
        font-style="italic" 
        font-size="12" 
        letter-spacing="3">Sélection des Grands Crus Salaisonniers</text>
</svg>
