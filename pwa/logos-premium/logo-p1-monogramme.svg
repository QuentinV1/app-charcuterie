<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dégradé Fond Caviar / Ardoise Profonde -->
    <radialGradient id="bgGradP1" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1C1A" />
      <stop offset="65%" stop-color="#121110" />
      <stop offset="100%" stop-color="#0A0909" />
    </radialGradient>

    <!-- Dégradé Or Champagne Satiné & Or Jaune Noble -->
    <linearGradient id="goldGradP1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2" />
      <stop offset="25%" stop-color="#DFBA6E" />
      <stop offset="50%" stop-color="#F5DF9E" />
      <stop offset="75%" stop-color="#C5963E" />
      <stop offset="100%" stop-color="#9E7226" />
    </linearGradient>

    <!-- Dégradé Or Pâle / Reflets d'orfèvre -->
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="50%" stop-color="#DFBA6E" />
      <stop offset="100%" stop-color="#FFF3D4" />
    </linearGradient>

    <!-- Ombre de prestige -->
    <filter id="luxeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Fond de présentation -->
  <rect width="800" height="800" rx="40" fill="url(#bgGradP1)" />

  <g transform="translate(400, 350)" filter="url(#luxeGlow)">
    <!-- 1. Poinçon d'Orfèvre Octogonal Épuré -->
    <!-- Filet extérieur fin -->
    <polygon points="
      -180,-75  -75,-180
       75,-180   180,-75
       180,75    75,180
      -75,180   -180,75" 
      fill="none" stroke="url(#goldGradP1)" stroke-width="2" stroke-opacity="0.4" />

    <!-- Filet intérieur principal -->
    <polygon points="
      -165,-68  -68,-165
       68,-165   165,-68
       165,68    68,165
      -68,165   -165,68" 
      fill="#171513" stroke="url(#goldGradP1)" stroke-width="3" />

    <!-- Clous d'assemblage / grains de sel aux 4 points cardinaux -->
    <circle cx="0" cy="-165" r="3" fill="url(#goldGradP1)" />
    <circle cx="165" cy="0" r="3" fill="url(#goldGradP1)" />
    <circle cx="0" cy="165" r="3" fill="url(#goldGradP1)" />
    <circle cx="-165" cy="0" r="3" fill="url(#goldGradP1)" />

    <!-- 2. Cristal de Sel / Étoile au zénith du monogramme -->
    <path d="M0,-122 Q0,-108 10,-108 Q0,-108 0,-94 Q0,-108 -10,-108 Q0,-108 0,-122 Z" 
          fill="url(#goldGradP1)" />
    <circle cx="0" cy="-108" r="1.5" fill="#FFF9E6" />

    <!-- 3. Monogramme 'A' Stylisé & Crochet de Maître Affineur -->
    <!-- Jambe gauche fine (délié noble) -->
    <path d="M-55,85 L-10,-72 C-8,-78 -2,-80 0,-80 C2,-80 8,-78 10,-72 L18,-42 L11,-42 L-2,-70 L-46,85 Z" 
          fill="url(#goldGradP1)" />

    <!-- Empattement inférieur gauche -->
    <path d="M-68,85 L-40,85 L-40,81 L-68,81 Z" fill="url(#goldGradP1)" />

    <!-- Jambe droite sculptée & biseautée (plein puissant) -->
    <path d="M-2,-76 L24,-76 L70,85 L50,85 L36,36 L8,36 L16,14 L30,14 L12,-48 L2,-76 Z" 
          fill="url(#goldGradP1)" />

    <!-- Empattement inférieur droit -->
    <path d="M42,85 L74,85 L74,81 L42,81 Z" fill="url(#goldGradP1)" />

    <!-- Barre médiane formant le Crochet d'Affinage d'Orfèvre -->
    <path d="M-26,14 
             C-10,14 20,14 24,14
             C24,14 28,30 22,46
             C16,62 -2,68 -12,58
             C-20,50 -18,36 -8,32
             C0,28 8,34 6,40
             C4,44 0,44 -2,42
             C-4,40 -2,36 2,36
             C4,36 8,40 4,46
             C-2,54 -14,50 -10,38
             C-8,30 8,24 16,36
             C20,44 18,20 18,20
             L-26,20 Z" 
          fill="url(#goldGradP1)" />

    <!-- Fil d'affinage supérieur délicat (alignement vertical) -->
    <line x1="0" y1="-80" x2="0" y2="-90" stroke="url(#goldGradP1)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 4. Logotype Typographique Épuré & Intemporel -->
  <!-- Titre Principal : L'AFFINOIR -->
  <text x="400" y="618" 
        text-anchor="middle" 
        fill="url(#goldLightGrad)" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', 'Trajan Pro', 'Didot', 'Georgia', serif" 
        font-size="46" 
        font-weight="600" 
        letter-spacing="14">L’AFFINOIR</text>
</svg>
