<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond Squircle Sombre de Luxe -->
    <radialGradient id="iconBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#221E1C" />
      <stop offset="60%" stop-color="#141110" />
      <stop offset="100%" stop-color="#0A0808" />
    </radialGradient>

    <!-- Dégradé Or Champagne Satiné -->
    <linearGradient id="iconGold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB8" />
      <stop offset="30%" stop-color="#DFBA6E" />
      <stop offset="65%" stop-color="#F5DF9E" />
      <stop offset="85%" stop-color="#C5963E" />
      <stop offset="100%" stop-color="#9E7226" />
    </linearGradient>

    <filter id="iconGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#iconBg)" stroke="url(#iconGold)" stroke-width="2.5" stroke-opacity="0.3" />

  <g transform="translate(256, 256) scale(1.18)" filter="url(#iconGlow)">
    <!-- Poinçon Octogonal -->
    <polygon points="
      -140,-58  -58,-140
       58,-140   140,-58
       140,58    58,140
      -58,140   -140,58" 
      fill="none" stroke="url(#iconGold)" stroke-width="2" stroke-opacity="0.5" />

    <polygon points="
      -128,-53  -53,-128
       53,-128   128,-53
       128,53    53,128
      -53,128   -128,53" 
      fill="#171513" stroke="url(#iconGold)" stroke-width="2.5" />

    <!-- Cristaux cardinaux -->
    <circle cx="0" cy="-128" r="2.5" fill="url(#iconGold)" />
    <circle cx="128" cy="0" r="2.5" fill="url(#iconGold)" />
    <circle cx="0" cy="128" r="2.5" fill="url(#iconGold)" />
    <circle cx="-128" cy="0" r="2.5" fill="url(#iconGold)" />

    <!-- Étoile zénith -->
    <path d="M0,-95 Q0,-84 8,-84 Q0,-84 0,-73 Q0,-84 -8,-84 Q0,-84 0,-95 Z" fill="url(#iconGold)" />

    <!-- Monogramme A & Crochet d'Affinage -->
    <path d="M-44,68 L-8,-58 C-6,-62 -2,-64 0,-64 C2,-64 6,-62 8,-58 L14,-34 L9,-34 L-2,-56 L-37,68 Z" fill="url(#iconGold)" />
    <path d="M-54,68 L-32,68 L-32,65 L-54,65 Z" fill="url(#iconGold)" />

    <path d="M-2,-61 L19,-61 L56,68 L40,68 L29,29 L6,29 L13,11 L24,11 L10,-38 L2,-61 Z" fill="url(#iconGold)" />
    <path d="M34,68 L59,68 L59,65 L34,65 Z" fill="url(#iconGold)" />

    <!-- Crochet sculpté -->
    <path d="M-21,11 
             C-8,11 16,11 19,11
             C19,11 22,24 18,37
             C13,50 -2,54 -10,46
             C-16,40 -14,29 -6,26
             C0,22 6,27 5,32
             C3,35 0,35 -2,34
             C-3,32 -2,29 2,29
             C3,29 6,32 3,37
             C-2,43 -11,40 -8,30
             C-6,24 6,19 13,29
             C16,35 14,16 14,16
             L-21,16 Z" 
          fill="url(#iconGold)" />

    <line x1="0" y1="-64" x2="0" y2="-72" stroke="url(#iconGold)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
